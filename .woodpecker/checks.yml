when:
  - event: push
    branch: main
    path:
      exclude: ["README.md", ".gitignore"]
steps:
  - name: all-tests
    image: nixos/nix
    commands:
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      - echo 'extra-substituters = https://devenv.cachix.org https://cachix.cachix.org' >> /etc/nix/nix.conf
      - echo 'extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=' >> /etc/nix/nix.conf
      - nix shell --inputs-from . nixpkgs#devenv
      - cd apps/conan
      - devenv shell -- init-conan-submodule
